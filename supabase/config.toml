
[functions.apimo-proxy]
enabled = true
verify_jwt = false
import_map = "./functions/apimo-proxy/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/apimo-proxy/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/apimo-proxy/*.html" ]

[functions.notify-lead]
enabled = true
verify_jwt = true
entrypoint = "./functions/notify-lead/index.ts"
