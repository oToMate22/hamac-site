
[functions.apimo-proxy]
enabled = true
verify_jwt = true
import_map = "./functions/apimo-proxy/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/apimo-proxy/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/apimo-proxy/*.html" ]

[functions.notify-lead]
enabled = true
verify_jwt = true
entrypoint = "./functions/notify-lead/index.ts"

# Formulaire public : appelé par le navigateur (clé publishable, pas de JWT utilisateur).
# La sécurité vient de la validation serveur + Turnstile + quota par IP, pas du JWT.
[functions.submit-form]
enabled = true
verify_jwt = false
entrypoint = "./functions/submit-form/index.ts"

# Tableau de bord : appelé uniquement par OTOMATE, avec signature HMAC.
# verify_jwt reste faux parce que l'appelant n'est pas un utilisateur Supabase.
# La porte est la signature, le nonce persistant et une seule organisation autorisée.
[functions.dashboard-metrics]
enabled = true
verify_jwt = false
entrypoint = "./functions/dashboard-metrics/index.ts"

