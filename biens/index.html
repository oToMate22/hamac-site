<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Découvrez les biens Hamac avec une recherche premium par type, ville et budget."
    />
    <title>Hamac — Recherche de biens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header is-scrolled">
      <div class="site-header__inner">
        <a class="logo" href="/"><span class="logo__brand">Hamac</span></a>
        <nav class="nav" aria-label="Navigation principale">
          <a href="/#biens">Acheter</a>
          <a href="/vendre">Vendre</a>
          <a href="/investir">Investir</a>
          <a href="/#notre-maison">Patrimoine</a>
          <a href="/#contact">Contact</a>
        </nav>
        <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="nav-mobile" aria-label="Ouvrir le menu">
          <span></span><span></span><span></span>
        </button>
      </div>
      <div id="nav-mobile" class="nav-mobile" hidden>
        <a href="/#biens">Acheter</a>
        <a href="/vendre">Vendre</a>
        <a href="/investir">Investir</a>
        <a href="/#notre-maison">Patrimoine</a>
        <a href="/#contact">Contact</a>
      </div>
    </header>

    <main id="contenu-principal" class="biens-page">
      <section class="section section--cream biens-page__hero">
        <div class="container">
          <p class="eyebrow">Recherche premium</p>
          <h1 class="section-title">Trouvez votre bien idéal</h1>
          <p class="section-intro">Filtrez par type, localisation et budget pour accéder aux opportunités les plus pertinentes.</p>
          <div class="biens-page__search">
            <div data-searchbar-root data-search-action="/acheter"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__bottom">
        <div class="container site-footer__bottom-inner">
          <p>© <span id="year"></span> Hamac Investissements &amp; Patrimoine. Tous droits réservés.</p>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/biens.ts"></script>
  </body>
</html>
